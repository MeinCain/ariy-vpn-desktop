[package]
name = "vpn-client"
version = "0.2.0-beta.1"
description = "Ariy VPN desktop client"
authors = ["Ariy VPN"]
edition = "2021"
default-run = "vpn-client"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "vpn_client_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-deep-link = "2"
tauri-plugin-global-shortcut = "2"
# 0.1.1 / Bug 5: single-instance Р·Р°С‰РёС‚Р°. РџСЂРё РїРѕРїС‹С‚РєРµ Р·Р°РїСѓСЃРєР° РІС‚РѕСЂРѕР№
# РєРѕРїРёРё вЂ” main СЌРєР·РµРјРїР»СЏСЂ РїРѕР»СѓС‡Р°РµС‚ callback, С„РѕРєСѓСЃРёСЂСѓРµС‚ СЃРІРѕС‘ РѕРєРЅРѕ,
# РІС‚РѕСЂРѕР№ РїСЂРѕС†РµСЃСЃ РјРѕР»С‡Р° РІС‹С…РѕРґРёС‚. Р‘РµР· СЌС‚РѕРіРѕ РїРѕР»СЊР·РѕРІР°С‚РµР»СЊ РјРѕРі РѕС‚РєСЂС‹РІР°С‚СЊ
# РїСЂРёР»РѕР¶РµРЅРёРµ РїР°С‡РєРѕР№ СЂР°Р· вЂ” РєР°Р¶РґС‹Р№ СЂР°Р· РЅРѕРІР°СЏ РёРЅСЃС‚Р°РЅС†РёСЏ, РєРѕРЅРєСѓСЂРµРЅС†РёСЏ
# Р·Р° helper-pipe Рё WFP-С„РёР»СЊС‚СЂС‹.
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-shell = "2.3.5"
# 14.A: auto-updater. РџРѕРґРґРµСЂР¶РёРІР°РµС‚ signed updates С‡РµСЂРµР· ed25519
# (РЅР°С€ Tauri signing key, РЅРµ Microsoft Authenticode). Endpoint вЂ”
# GitHub Releases СЃ latest.json РєРѕС‚РѕСЂС‹Р№ РіРµРЅРµСЂРёС‚СЃСЏ РІ CI workflow.
tauri-plugin-updater = "2"
# 14.A: process plugin РґР»СЏ `relaunch()` РїРѕСЃР»Рµ download+install update'Р°.
# Р‘РµР· РЅРµРіРѕ С„СЂРѕРЅС‚ РЅРµ РјРѕР¶РµС‚ РїРµСЂРµР·Р°РїСѓСЃС‚РёС‚СЊ app РїРѕСЃР»Рµ tauri-plugin-updater'Р°.
tauri-plugin-process = "2"
# Native Windows toasts (С‡РµСЂРµР· WinRT ToastNotifier API). РџРѕРєР°Р·С‹РІР°СЋС‚СЃСЏ РІ
# Action Center РєРѕРіРґР° РѕРєРЅРѕ СЃРІС‘СЂРЅСѓС‚Рѕ/РІ С‚СЂРµРµ. РџСЂРё РІРёРґРёРјРѕРј РѕРєРЅРµ РёСЃРїРѕР»СЊР·СѓРµРј
# in-app Toaster вЂ” РЅР°С‚РёРІРЅС‹Рµ РЅСѓР¶РЅС‹ РёРјРµРЅРЅРѕ РєРѕРіРґР° СЋР·РµСЂ РЅРµ СЃРјРѕС‚СЂРёС‚ РЅР° app.
tauri-plugin-notification = "2"
serde_yaml = "0.9.34"
base64 = "0.22.1"
uuid = { version = "1.23.1", features = ["v4"] }
anyhow = "1.0.102"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "socks", "json"] }
tokio = { version = "1", features = ["net", "time", "rt", "io-util", "macros", "sync", "process"] }
futures = "0.3"
# 14.F: zip-Р°СЂС…РёРІ РґР»СЏ export_diagnostics (РґРёР°РіРЅРѕСЃС‚РёС‡РµСЃРєРёР№ РїР°РєРµС‚ РґР»СЏ СЃР°РїРїРѕСЂС‚Р°).
# Р‘РµР· compression-features С‡С‚РѕР±С‹ РЅРµ С‚СЏРЅСѓС‚СЊ Р»РёС€РЅРёРµ Р·Р°РІРёСЃРёРјРѕСЃС‚Рё вЂ” РІ zip РєР»Р°РґС‘Рј
# СѓР¶Рµ РјРµР»РєРёРµ С‚РµРєСЃС‚РѕРІС‹Рµ С„Р°Р№Р»С‹ (Р»РѕРіРё + JSON), СЃР¶Р°С‚РёРµ deflate РЅРµ РєСЂРёС‚РёС‡РЅРѕ.
zip = { version = "2.2", default-features = false, features = ["deflate"] }
# 11.B: sha256 РґР»СЏ verify-after-download geofiles. РўРѕР»СЊРєРѕ integrity-check,
# РЅРµ security-critical вЂ” РЅРѕ С‡РµСЂРµР· РєСЂРµР№С‚ РєРѕРјРїР°РєС‚РЅРµРµ С‡РµРј РІРµР»РѕСЃРёРїРµРґ.
sha2 = "0.10"
# 8.F: percent-encoding РґР»СЏ РїСѓС‚РµР№ РІ URL mihomo external-controller API.
# РРјРµРЅР° РіСЂСѓРїРї РјРѕРіСѓС‚ СЃРѕРґРµСЂР¶Р°С‚СЊ UTF-8 / emoji (В«рџ‡Єрџ‡є FastestВ»), Р±РµР· encoding
# reqwest РїР°РґР°РµС‚ СЃ invalid URI.
urlencoding = "2"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-service = "0.7"
# Р—Р°С‰РёС‰С‘РЅРЅРѕРµ С…СЂР°РЅРёР»РёС‰Рµ РґР»СЏ СЃРµРєСЂРµС‚РѕРІ (URL РїРѕРґРїРёСЃРєРё, HWID-override).
# РСЃРїРѕР»СЊР·СѓРµС‚ Windows Credential Manager С‡РµСЂРµР· keyring-rs (СЌС‚Р°Рї 6.A).
keyring = "3"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    # 13.D: WFP API (FwpmEngineOpen0, FwpmFilterAdd0, FWPM_LAYER_*).
    # РСЃРїРѕР»СЊР·СѓРµС‚СЃСЏ С‚РѕР»СЊРєРѕ РІ helper'Рµ вЂ” РЅРѕ features РІ windows-sys
    # РіР»РѕР±Р°Р»СЊРЅС‹Рµ РЅР° РєСЂРµР№С‚, РїРѕСЌС‚РѕРјСѓ РѕР±СЉСЏРІР»СЏРµРј Р·РґРµСЃСЊ.
    "Win32_NetworkManagement_WindowsFilteringPlatform",
    "Win32_Networking_WinSock",
    "Win32_System_Console",
    # 9.B: EnumProcesses + K32GetModuleBaseNameW РґР»СЏ РґРµС‚РµРєС‚Р° Р·Р°РїСѓС‰РµРЅРЅС‹С…
    # СЃС‚РѕСЂРѕРЅРЅРёС… VPN-РєР»РёРµРЅС‚РѕРІ (Р±РµР· admin, PROCESS_QUERY_LIMITED_INFORMATION).
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
    "Win32_System_Rpc",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

# Helper-СЃРµСЂРІРёСЃ РєР°Рє РѕС‚РґРµР»СЊРЅС‹Р№ РёСЃРїРѕР»РЅСЏРµРјС‹Р№ С„Р°Р№Р». Р—Р°РїСѓСЃРєР°РµС‚СЃСЏ СЃ РїСЂР°РІР°РјРё SYSTEM
# С‡РµСЂРµР· Windows Service Control Manager Рё СЃР»СѓС€Р°РµС‚ named pipe РґР»СЏ РєРѕРјР°РЅРґ РѕС‚
# user-mode Tauri-РїСЂРёР»РѕР¶РµРЅРёСЏ (СѓРїСЂР°РІР»РµРЅРёРµ TUN-РёРЅС‚РµСЂС„РµР№СЃРѕРј Рё routing).
[[bin]]
name = "ariy-helper"
path = "src/bin/ariy_helper.rs"

# 14.C: line-tables С‚РѕР»СЊРєРѕ РІ release-СЃР±РѕСЂРєРµ. Backtrace РІ crash-dump'Р°С…
# СЃРѕРґРµСЂР¶РёС‚ С‡РёС‚Р°РµРјС‹Рµ file:line, Р° СЂР°Р·РјРµСЂ Р±РёРЅР°СЂРЅРёРєР° СЂР°СЃС‚С‘С‚ РјРёРЅРёРјР°Р»СЊРЅРѕ
# (~1-3 РњР‘ РїСЂРѕС‚РёРІ 30 РњР‘ РґР»СЏ РїРѕР»РЅС‹С… debug-symbols). Compromise: РґРѕСЃС‚Р°С‚РѕС‡РЅРѕ
# РґР»СЏ РїСЂРѕРґ-РґРёР°РіРЅРѕСЃС‚РёРєРё, РЅРµ СЂР°Р·РґСѓРІР°РµС‚ installer.
[profile.release]
